name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Build release notes from changelog
        shell: bash
        run: |
          {
            echo "## IPI Stay Fly Driver ${GITHUB_REF_NAME}"
            echo
            echo "Open-source replacement driver for the **IPI STAY FLY** wireless gaming mouse."
            echo
            # Extract this tag's section from CHANGELOG.md (between its
            # "## [x.y.z]" header and the next one).
            version="${GITHUB_REF_NAME#v}"
            awk -v ver="$version" '
              $0 ~ "^## \\[" ver "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md
            echo
            echo "### Requirements"
            echo "- Windows 10/11 (64-bit)"
            echo "- WebView2 runtime (pre-installed on Windows 11; [download for Windows 10](https://developer.microsoft.com/en-us/microsoft-edge/webview2/))"
            echo
            echo "### Installation"
            echo "Download the portable **IPI STAY FLY Driver.exe** or use the Windows installer from the release assets."
            echo "The binaries are not code-signed, so Windows SmartScreen may warn on first launch."
          } > release-notes.md

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: release-notes.md
          files: |
            src-tauri/target/release/IPI STAY FLY Driver.exe
            src-tauri/target/release/bundle/nsis/IPI STAY FLY Driver_*.exe
            src-tauri/target/release/bundle/msi/IPI STAY FLY Driver_*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
