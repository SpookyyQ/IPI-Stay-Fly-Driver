  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

=\"color:var(--gold);\">—<\u002Fspan>Rust, via rustup<\u002Fdiv>\n<div style=\"display:flex;gap:12px;font-size:14.5px;color:var(--text2);line-height:1.6;\"><span style=\"color:var(--gold);\">—<\u002Fspan>Visual Studio Build Tools 2022, with the \"Desktop development with C++\" workload<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"getting-started\" style=\"margin-bottom:56px;scroll-margin-top:96px;\">\n<h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;margin:0 0 20px;\">Running from source<\u002Fh2>\n<p style=\"font-size:14.5px;line-height:1.65;color:var(--text2);margin:0 0 20px;\">Optional if you already grabbed the installer above — useful for development or testing unreleased changes.<\u002Fp>\n<div style=\"background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:20px 24px;font-family:ui-monospace,Menlo,monospace;font-size:13.5px;line-height:1.95;color:var(--text2);\">\n<div>git clone https://github.com/SpookyyQ/IPI-Stay-Fly-Driver.git<\u002Fdiv>\n<div>cd IPI-Stay-Fly-Driver<\u002Fdiv>\n<div>npm install<\u002Fdiv>\n<div>npm run tauri dev<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"build\" style=\"margin-bottom:56px;scroll-margin-top:96px;\">\n<h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;margin:0 0 20px;\">Building the app<\u002Fh2>\n<div style=\"background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:20px 24px;font-family:ui-monospace,Menlo,monospace;font-size:13.5px;line-height:1.95;color:var(--text2);margin-bottom:16px;\">\n<div>npm run tauri build<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-size:14.5px;line-height:1.65;color:var(--text2);margin:0;\">The generated installer and release files land in <span style=\"font-family:ui-monospace,Menlo,monospace;background:var(--bg3);padding:2px 6px;border-radius:5px;color:var(--text);\">src-tauri/target/release/bundle/<\u002Fspan>.<\u002Fp>\n<\u002Fdiv>\n\n<div id=\"hardware\" style=\"margin-bottom >Polling rate<\u002Fdiv><div style=\"font-size:13.5px;color:var(--text);font-weight:600;\">125 / 250 / 500 / 1000 / 2000 / 4000 / 8000 Hz<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;padding:14px 20px;border-bottom:1px solid var(--border);\"><div style=\"font-size:13.5px;color:var(--text3);\">Switches<\u002Fdiv><div style=\"font-size:13.5px;color:var(--text);font-weight:600;\">Omron mechanical<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--bg2);\"><div style=\"font-size:13.5px;color:var(--text3);\">Weight<\u002Fdiv><div style=\"font-size:13.5px;color:var(--text);font-weight:600;\">48 g ± 2 g<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;padding:14px 20px;border-bottom:1px solid var(--border);\"><div style=\"font-size:13.5px;color:var(--text3);\">Connectivity<\u002Fdiv><div style=\"font-size:13.5px;color:var(--text);font-weight:600;\">2.4 GHz wireless, Bluetooth, USB wired<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--bg2);\"><div style=\"font-size:13.5px;color:var(--text3);\">Battery<\u002Fdiv><div style=\"font-size:13.5px;color:var(--text);font-weight:600;\">300 mAh<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;padding:14px 20px;\"><div style=\"font-size:13.5px;color:var(--text3);\">Chip<\u002Fdiv><div style=\"font-size:13.5px;color:var(--text);font-weight:600;\">Nordic 54L15<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-size:13.5px;line-height:1.6;color:var(--text3);margin:16px 0 0;\">Own an IPI FLOAT 88, QI Pro or other IPI-compatible mouse? Protocol captures and HID identifiers help bring support to more devices.<\u002Fp>\n<\u002Fdiv>\n\n<div id=\"protocol\" style=\"margin-bottom:56px;scroll-margin-top:96px;\">\n<h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;margin:0 0 20px;\">Protocol notes<\u002Fh2>\n<p style=\"font-size:14.5px;line-height:1.65;color:var(--text2);margin:0 0 16px;\">The app communicates with the mouse through reverse-engineered HID frames.<\u002Fp>\n<div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:20px;\">\n<div style=\"display:flex;gap:12px;font-size:14.5px;color:var(--text2);\"><span style=\"color:var(--gold);\">—<\u002Fspan>Frame size: 16 bytes<\u002Fdiv>\n<div style=\"display:flex;gap:12px;font-size:14.5px;color:var(--text2);\"><span style=\"color:var(--gold);\">—<\u002Fspan>Report ID: 8<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:20px 24px;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.8;color:var(--text2);margin-bottom:16px;\">\n<div style=\"color:var(--text3);\">// global checksum<\u002Fdiv>\n<div>byte[0] = (0x4D - sum(byte[2..=15])) &amp; 0xFF<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-size:14.5px;line-height:1.65;color:var(--text2);margin:0;\">Implemented commands and captured protocol tests live in <span style=\"font-family:ui-monospace,Menlo,monospace;background:var(--bg3);padding:2px 6px;border-radius:5px;color:var(--text);\">src-tauri/src/protocol.rs<\u002Fspan>.<\u002Fp>\n<\u002Fdiv>\n\n<div id=\"testing\" style=\"margin-bottom:56px;scroll-margin-top:96px;\">\n<h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;margin:0 0 20px;\">Tests &amp; developer panel<\u002Fh2>\n<div style=\"background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:20px 24px;font-family:ui-monospace,Menlo,monospace;font-size:13.5px;line-height:1.95;color:var(--text2);margin-bottom:16px;\">\n<div>cd src-tauri<\u002Fdiv>\n<div>cargo test<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-size:14.5px;line-height:1.65;color:var(--text2);margin:0;\">Press <span style=\"font-family:ui-monospace,Menlo,monospace;background:var(--bg3);padding:2px 6px;border-radius:5px;color:var(--text);\">Ctrl+Shift+D<\u002Fspan> while the app is running to open the raw HID frame panel — useful for protocol exploration and debugging device communication.<\u002Fp>\n<\u002Fdiv>\n\n<div id=\"contributing\" style=\"margin-bottom:56px;scroll-margin-top:96px;\">\n<h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;margin:0 0 20px;\">Contributing<\u002Fh2>\n<p style=\"font-size:14.5px;line-height:1.65;color:var(--text2);margin:0 0 20px;\">Pull requests and protocol captures are welcome. If you own an IPI STAY FLY and can verify unimplemented settings, open an issue with device details, app version and captured USB/HID behavior where possible.<\u002Fp>\n<a href=\"https://github.com/SpookyyQ/IPI-Stay-Fly-Driver/issues\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--border-strong);color:var(--text);padding:12px 22px;border-radius:8px;font-weight:600;font-size:14px;font-family:'Space Grotesk',sans-serif;text-decoration:none;\">Open an issue ↗<\u002Fa>\n<\u002Fdiv>\n\n<div id=\"license\" style=\"margin-bottom:24px;scroll-margin-top:96px;\">\n<h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;margin:0 0 16px;\">License<\u002Fh2>\n<p style=\"font-size:14.5px;line-height:1.65;color:var(--text2);margin:0;\">This project is licensed under the MIT License.<\u002Fp>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;align-items:center;justify-content:space-between;padding:26px 56px;border-top:1px solid var(--border);font-size:13px;color:var(--text3);\">\n<div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--text2);\">IPI STAY FLY Driver<\u002Fdiv>\n<div style=\"display:flex;gap:24px;align-items:center;\">\n<a href=\"index.html\" style=\"color:var(--text3);text-decoration:none;\">Home<\u002Fa>\n<a href=\"https://github.co
